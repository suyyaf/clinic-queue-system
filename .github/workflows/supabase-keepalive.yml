name: Supabase Keepalive

# Supabase free-tier projects pause automatically after 7 days with no
# database activity. This app talks to Postgres directly (Prisma + pg),
# not the Supabase REST API, so we ping by running a trivial query
# against the DB daily instead of hitting /rest/v1/.

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC — off the hour to avoid GH Actions cron congestion
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: psql "$DATABASE_URL" -c "SELECT 1;"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
